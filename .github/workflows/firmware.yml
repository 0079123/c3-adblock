name: firmware

# Builds and publishes the ESP32-C3 and classic-ESP32 images to the rolling `firmware`
# release. Single owner of that release: two workflows publishing to the same tag would
# fight over the notes and leave a confusing mix of assets.
#
# What lands there, and who consumes it:
#   firmware-c3.bin          C3 app -- both the browser installer (docs/manifest.json) and
#                            the README's dashboard OTA flow
#   firmware-esp32dev.bin    classic ESP32 app, OTA only
#   bootloader.bin           \
#   partitions.bin            |  browser installer only; ESP Web Tools writes these to
#   boot_app0.bin             |  fixed offsets, so they ship alongside the app
#   littlefs.bin             /   the filesystem image, blocklist included
#
# Only pushes to main publish; pull requests are covered by the `build` workflow, which
# just compiles both boards.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'platformio.ini'
      - 'partitions*.csv'
      - 'tools/build_blocklist.py'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install -U platformio

      # Refuse to publish firmware built from a tree whose rule tooling is broken.
      - name: Unit tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Embedded web UI checks
        run: python3 tools/check_ui.py

      - name: Placeholder secrets (real ones are gitignored; the firmware falls back to the setup portal)
        run: cp src/secrets.example.h src/secrets.h

      # The classic-ESP32 build goes FIRST and its app image is collected immediately:
      # a PIO/SCons quirk (observed since the page_gz pre-script was added) makes a later
      # build wipe the OTHER env's products in .pio/build/, so nothing built earlier may
      # be left in the build tree across steps. Each board's artifacts are copied out
      # right after that board finishes.
      - run: pio run -e esp32dev
      - name: Collect the classic-ESP32 app image
        run: |
          set -eu
          trap 'echo "::error::esp32dev collect failed at line $LINENO"' ERR
          mkdir -p out
          cp .pio/build/esp32dev/firmware.bin out/firmware-esp32dev.bin

      - run: pio run -e c3

      # The filesystem image carries the blocklist. data/blocklist.bin is gitignored, so pull
      # the published one -- otherwise a web-installer flash lands with an empty ruleset.
      - name: Fetch the latest blocklist for the filesystem image
        run: |
          mkdir -p data
          curl -fsSL -o data/blocklist.bin \
            "https://github.com/${{ github.repository }}/releases/download/blocklist/blocklist.bin"
          test -s data/blocklist.bin
      - run: pio run -e c3 -t buildfs

      - name: Collect the C3 release assets
        run: |
          set -eu
          trap 'echo "::error::c3 collect failed at line $LINENO"' ERR
          # Installer-only parts, all from the C3 build. Collected immediately after the
          # buildfs step for the same coexistence reason as above.
          cp .pio/build/c3/firmware.bin        out/firmware-c3.bin
          cp .pio/build/c3/bootloader.bin out/
          cp .pio/build/c3/partitions.bin out/
          cp .pio/build/c3/littlefs.bin   out/
          # PlatformIO does not emit boot_app0.bin; it ships inside the Arduino framework
          # package (the file the original docs/ copy came from -- byte-identical). ESP Web
          # Tools needs it at 0xE000 to select an OTA slot on first boot.
          BOOT_APP0="$(find "$HOME/.platformio/packages" -name boot_app0.bin -print -quit)"
          test -n "$BOOT_APP0" || { echo "boot_app0.bin not found in the framework package"; exit 1; }
          cp "$BOOT_APP0" out/
          ls -l out

          # The offsets in docs/manifest.json must match this partition table, or the
          # installer writes the app over the wrong region.
          python3 - <<'PY'
          import json, sys
          parts = {p["path"].rsplit("/", 1)[-1]: p["offset"]
                   for p in json.load(open("docs/manifest.json"))["builds"][0]["parts"]}
          want = {"bootloader.bin": 0, "partitions.bin": 32768, "boot_app0.bin": 57344,
                  "firmware-c3.bin": 65536, "littlefs.bin": 2818048}
          for name, off in want.items():
              got = parts.get(name)
              if got != off:
                  sys.exit(f"manifest offset mismatch for {name}: manifest={got} expected={off}")
          print("manifest offsets match the partition layout")
          PY

      - name: Publish to the firmware release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          TAG=firmware
          notes="Auto-built from ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d).

          Browser install: https://0079123.github.io/c3-adblock/

          OTA: upload firmware-c3.bin under *Firmware -> OTA update* in the device dashboard
          (firmware-esp32dev.bin for a classic ESP32). Built with placeholder credentials, so
          a fresh unit starts the setup portal -- set WEB_USER / WEB_PASS / OTA_PASS there.
          littlefs.bin carries the blocklist published by the blocklist workflow."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --title "Firmware" --notes "$notes"
          fi
          gh release upload "$TAG" out/*.bin --clobber

          # Drop assets that are no longer part of the set. A renamed asset otherwise lingers
          # forever and the release reads as if it ships two different app images, which is
          # exactly the confusion that prompted consolidating these workflows.
          keep=" $(cd out && ls *.bin | tr '\n' ' ') "
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$keep" in
              *" $name "*) ;;
              *) echo "removing stale asset: $name"; gh release delete-asset "$TAG" "$name" --yes ;;
            esac
          done
