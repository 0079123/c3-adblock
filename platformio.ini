[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Regenerates src/page_gz.h (gzipped dashboard) before every compile so it can
; never go stale against page.h. Consumed by the "/" handler in main.cpp.
extra_scripts = pre:tools/gen_page_gz.py
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
