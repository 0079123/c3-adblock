[platformio]
default_envs = c3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
; Regenerates src/page_gz.h (gzipped dashboard) before every compile so it can
; never go stale against page.h. Consumed by the "/" handler in main.cpp.
extra_scripts = pre:tools/gen_page_gz.py
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ESP32-S3 16MB (XIAO ESP32S3 / S3 SuperMini / S3 Zero 16MB): dual OTA + 10.4 MB
; LittleFS (~2.1M domain entries) + 8 MB PSRAM headroom. Use partitions16.csv.
[env:s3]
board = esp32-s3-devkitc-1
board_build.partitions = partitions16.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
